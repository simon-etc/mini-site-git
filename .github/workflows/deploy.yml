name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Mise à jour automatique tous les mardis à 10h (UTC) – jours de patch LoL
    - cron: '0 10 * * 2'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pré-chargement des données Riot (Data Dragon)
        run: node scripts/fetch-data.js

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publication des fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
